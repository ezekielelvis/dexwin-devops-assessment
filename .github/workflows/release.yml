name: Release assessment service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Test application
        working-directory: app
        run: npm test
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: assessment-validation
          version: v0.32.0
          kubectl_version: v1.36.1
      - name: Validate Kubernetes assets
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply --dry-run=server \
            -f kubernetes/configmap.yaml \
            -f kubernetes/deployment.yaml \
            -f kubernetes/service.yaml

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/customer-api" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Scan candidate digest
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln

  simulate-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: assessment-production-simulation
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Require explicit simulation opt-in
        env:
          ENABLE_SIMULATION: ${{ vars.ENABLE_ASSESSMENT_RELEASE_SIMULATION }}
        run: test "$ENABLE_SIMULATION" = "true"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: assessment-release
          version: v0.32.0
          kubectl_version: v1.36.1
      - name: Establish simulated baseline
        id: baseline
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl -n assessment create secret generic ghcr \
            --from-file=.dockerconfigjson="$HOME/.docker/config.json" \
            --type=kubernetes.io/dockerconfigjson
          kubectl -n assessment patch serviceaccount default --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr"}]}'
          kubectl apply -f kubernetes/configmap.yaml -f kubernetes/service.yaml
          kubectl set image --local -f kubernetes/deployment.yaml \
            customer-api="$IMAGE" -o yaml | kubectl apply -f -
          kubectl -n assessment rollout status deployment/customer-api --timeout=120s
          revision="$(kubectl -n assessment get deployment customer-api \
            -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"
          [[ "$revision" =~ ^[0-9]+$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Roll out and verify simulated release
        id: release
        run: |
          kubectl -n assessment patch deployment customer-api --type=merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"assessment.example.com/release\":\"$GITHUB_SHA\"}}}}}"
          kubectl -n assessment rollout status deployment/customer-api --timeout=120s
          kubectl -n assessment exec deployment/customer-api -- node -e '
            fetch("http://customer-api/api/status", { signal: AbortSignal.timeout(5000) })
              .then(async res => {
                if (!res.ok || (await res.json()).service !== "customer-api") throw new Error("Service verification failed");
              })
              .catch(err => { console.error(err); process.exitCode = 1; });
          '
      - name: Roll back failed simulated release
        if: failure() && steps.release.outcome == 'failure'
        env:
          BASELINE_REVISION: ${{ steps.baseline.outputs.revision }}
        run: |
          kubectl -n assessment rollout undo deployment/customer-api --to-revision="$BASELINE_REVISION"
          kubectl -n assessment rollout status deployment/customer-api --timeout=120s
          kubectl -n assessment exec deployment/customer-api -- node -e '
            fetch("http://customer-api/api/status", { signal: AbortSignal.timeout(5000) })
              .then(async res => {
                if (!res.ok || (await res.json()).service !== "customer-api") throw new Error("Service verification failed");
              })
              .catch(err => { console.error(err); process.exitCode = 1; });
          '
